<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Really Good Game</title>
<meta name="description" content="Really Good Game makes cozy mobile games.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700;900&display=swap">
<style>
:root{--night:#1d1027;--card:#2a1838;--gold:#e7b65a;--gold-hi:#ffe08a;--cream:#fff4dc;--muted:#c8b8d4;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--night);color:var(--cream);font-family:'Nunito',system-ui,sans-serif;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:56px max(16px,env(safe-area-inset-left,0px)) 56px max(16px,env(safe-area-inset-right,0px))}
h1{font:400 clamp(34px,6vw,52px)/1.05 'Lilita One','Trebuchet MS',sans-serif;color:var(--gold-hi);margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 32px;font-size:17px}
.game{display:flex;gap:18px;align-items:center;background:var(--card);border:2px solid #4a3260;border-radius:20px;padding:16px;text-decoration:none;color:inherit}
.game:hover,.game:focus-visible{border-color:var(--gold);outline:none}
.game img{width:88px;height:88px;border-radius:20px;flex:none}
.game b{display:block;font:400 24px 'Lilita One','Trebuchet MS',sans-serif;color:var(--cream)}
.game span{color:var(--muted)}
footer{margin-top:40px;color:#a898b8;font-size:14px}
footer a{color:var(--gold)}
</style>
</head>
<body>
<main>
  <h1>Really Good Game</h1>
  <p class="lede">We make cozy games for iPhone and iPad.</p>
  <a class="game" href="/witchs-greenhouse/"><img src="/img/wg-icon.png" alt="" width="88" height="88"><div><b>Witch's Greenhouse</b><span>Match flowers, restore a magical greenhouse and explore the world.</span></div></a>
  <footer>Contact: reallygoodgamesllc@gmail.com · <a href="/witchs-greenhouse/support/">Support</a> · <a href="/witchs-greenhouse/privacy/">Privacy</a></footer>
</main>
</body>
</html>
